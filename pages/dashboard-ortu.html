<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f18518">
  <title>Nilai Anak &middot; SIMKUR MA'HAD</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../icons/icon-192.png">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="who">
      <strong id="nama-ortu">&nbsp;</strong>
      <span>Orang Tua / Wali</span>
    </div>
    <button type="button" class="btn-logout" id="btn-logout">Keluar</button>
  </header>

  <main class="app">
    <section class="card">
      <h2>Nilai Anak</h2>
      <p class="status-msg info" id="nilai-status">Memuat...</p>
      <div id="nilai-body"></div>
      <details class="raw" id="raw-wrap" hidden>
        <summary>Lihat data mentah</summary>
        <pre id="nilai-raw"></pre>
      </details>
    </section>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/guard.js"></script>
  <script>
  (function () {
    'use strict';

    var user = currentUser();
    document.getElementById('nama-ortu').textContent = user.nama || 'Wali Santri';
    document.getElementById('btn-logout').addEventListener('click', logout);

    var statusEl = document.getElementById('nilai-status');
    var bodyEl = document.getElementById('nilai-body');

    function setMsg(kind, msg) {
      statusEl.className = 'status-msg ' + kind;
      statusEl.textContent = msg;
      statusEl.hidden = false;
    }

    // Ubah bentuk apa pun jadi [{ mapel, nilai }].
    function normalize(data) {
      if (!data) return [];
      var arr = Array.isArray(data) ? data
              : (data.nilai || data.mapel || data.data || data.list || null);

      if (Array.isArray(arr)) {
        return arr.map(function (it) {
          if (it && typeof it === 'object') {
            return {
              mapel: it.mapel || it.namaMapel || it.mapelNama || it.name || it.mataPelajaran || '(mapel)',
              nilai: it.nilai != null ? it.nilai : (it.nilaiAkhir != null ? it.nilaiAkhir : it.value)
            };
          }
          return { mapel: String(it), nilai: '' };
        });
      }

      // objek { "Fiqih": 88, "Nahwu": 90, ... }
      if (data && typeof data === 'object') {
        return Object.keys(data).map(function (k) {
          return { mapel: k, nilai: data[k] };
        });
      }
      return [];
    }

    (async function load() {
      try {
        var r = await apiCall('getNilaiAnak', {});
        console.log('getNilaiAnak ->', r);

        if (!r || !r.success) {
          setMsg('err', (r && r.message) || 'Gagal memuat nilai.');
          return;
        }

        document.getElementById('nilai-raw').textContent = JSON.stringify(r.data, null, 2);
        document.getElementById('raw-wrap').hidden = false;

        var list = normalize(r.data).filter(function (x) {
          return x.nilai !== undefined && x.nilai !== null && x.nilai !== '';
        });

        if (!list.length) {
          setMsg('info', 'Belum ada nilai.');
          return;
        }

        statusEl.hidden = true;
        bodyEl.innerHTML = list.map(function (x) {
          return '<div class="nilai-item"><span class="mapel">' +
                 String(x.mapel) + '</span><span class="angka">' +
                 String(x.nilai) + '</span></div>';
        }).join('');
      } catch (err) {
        setMsg('err', 'Tidak dapat terhubung ke server.');
        console.error(err);
      }
    })();
  })();
  </script>
</body>
</html>
