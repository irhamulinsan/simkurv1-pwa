<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f18518">
  <title>Dashboard Guru &middot; SIMKUR MA'HAD</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand-logo" aria-hidden="true"><span>MA</span></div>
    <div class="tb-who">
      <strong id="nama-guru" class="js-nama">&nbsp;</strong>
      <span>Guru</span>
    </div>
    <button type="button" class="btn-logout" id="btn-logout-top" data-logout>Keluar</button>
  </header>

  <div class="app">
    <aside class="side">
      <div class="side-brand">
        <div class="brand-logo" aria-hidden="true"><span>MA</span></div>
        <div class="brand-name">SIMKUR MA'HAD</div>
        <div class="brand-sub js-nama">&nbsp;</div>
      </div>
      <nav class="side-nav">
        <a class="snav" data-sec="sec-kbm" href="#sec-kbm"><span class="ic">📝</span> Input KBM</a>
        <a class="snav" data-sec="sec-nilai" href="#sec-nilai"><span class="ic">💯</span> Input Nilai</a>
        <a class="snav" data-sec="sec-jadwal" href="#sec-jadwal"><span class="ic">🗓️</span> Jadwal Saya</a>
        <a class="snav" data-sec="sec-rkbm" href="#sec-rkbm"><span class="ic">📚</span> Riwayat KBM</a>
        <a class="snav" data-sec="sec-rabs" href="#sec-rabs"><span class="ic">🙋</span> Riwayat Absensi</a>
        <a class="snav" data-sec="sec-agenda" href="#sec-agenda"><span class="ic">📅</span> Kalender / Agenda</a>
      </nav>
      <div class="side-foot">
        <button type="button" class="btn-logout" id="btn-logout" data-logout>Keluar</button>
      </div>
    </aside>

    <main class="main">
    <!-- ============ INPUT KBM & ABSENSI ============ -->
    <section class="card" id="sec-kbm">
      <h2>Input KBM &amp; Absensi</h2>

      <form id="form-kbm">
        <div class="form-grid">
          <div class="field">
            <label for="kbm-kelas">Kelas</label>
            <select id="kbm-kelas" required></select>
          </div>
          <div class="field">
            <label for="kbm-sesi">Sesi</label>
            <select id="kbm-sesi" required></select>
          </div>
          <div class="field full">
            <label for="kbm-mapel">Mata Pelajaran</label>
            <input type="text" id="kbm-mapel" name="mapel" autocomplete="off" required>
          </div>
          <div class="field full">
            <label for="kbm-materi">Materi</label>
            <textarea id="kbm-materi" name="materi" required></textarea>
          </div>
          <div class="field full">
            <label for="kbm-catatan">Catatan (opsional)</label>
            <textarea id="kbm-catatan" name="catatan"></textarea>
          </div>
        </div>
        <button type="submit" class="btn-block" id="kbm-submit">Simpan KBM</button>
        <p class="status-msg info" id="kbm-status" hidden></p>
      </form>
    </section>

    <!-- ============ INPUT NILAI ============ -->
    <section class="card" id="sec-nilai">
      <h2>
        Input Nilai
        <span class="hint">Pilih kelas lalu muat daftar santri.</span>
      </h2>

      <div class="form-grid">
        <div class="field">
          <label for="nilai-kelas">Kelas</label>
          <select id="nilai-kelas"></select>
        </div>
        <div class="field">
          <label for="nilai-semester">Semester</label>
          <select id="nilai-semester">
            <option value="1">Semester 1</option>
            <option value="2">Semester 2</option>
          </select>
        </div>
        <div class="field">
          <label for="nilai-mapel">Mapel ID</label>
          <input type="text" id="nilai-mapel" autocomplete="off">
        </div>
        <div class="field">
          <label for="nilai-jenis">Jenis</label>
          <input type="text" id="nilai-jenis" autocomplete="off" placeholder="UH / UTS / UAS">
        </div>
        <div class="field">
          <label for="nilai-nomor">Nomor Ulangan</label>
          <input type="number" id="nilai-nomor" min="1" step="1" value="1">
        </div>
        <div class="field">
          <label for="nilai-ket">Keterangan</label>
          <input type="text" id="nilai-ket" autocomplete="off">
        </div>
      </div>

      <button type="button" class="btn-block" id="btn-muat-santri">Muat Santri</button>
      <p class="status-msg info" id="nilai-status" hidden></p>

      <div id="santri-list"></div>

      <button type="button" class="btn-block" id="btn-simpan-nilai" hidden>Simpan Semua</button>
    </section>

    <!-- ============ JADWAL SAYA (collapsible) ============ -->
    <details class="card" id="sec-jadwal">
      <summary>Jadwal Saya</summary>
      <p class="status-msg info" id="jadwal-status" hidden></p>
      <div id="jadwal-table"></div>
    </details>

    <!-- ============ RIWAYAT KBM (collapsible) ============ -->
    <details class="card" id="sec-rkbm">
      <summary>Riwayat KBM</summary>
      <p class="status-msg info" id="rkbm-status" hidden></p>
      <div id="rkbm-table"></div>
    </details>

    <!-- ============ RIWAYAT ABSENSI SAYA (collapsible) ============ -->
    <details class="card" id="sec-rabs">
      <summary>Riwayat Absensi Saya</summary>
      <p class="status-msg info" id="rabs-status" hidden></p>
      <div id="rabs-table"></div>
    </details>

    <!-- ============ KALENDER / AGENDA ============ -->
    <section class="card" id="sec-agenda">
      <h2>Kalender / Agenda</h2>
      <p class="status-msg info" id="agenda-status" hidden></p>
      <div id="agenda-list"></div>
    </section>
    </main>
  </div>

  <nav class="bottomnav">
    <a class="bnv" data-sec="sec-kbm" href="#sec-kbm"><span class="ic">📝</span>KBM</a>
    <a class="bnv" data-sec="sec-nilai" href="#sec-nilai"><span class="ic">💯</span>Nilai</a>
    <a class="bnv" data-sec="sec-jadwal" href="#sec-jadwal"><span class="ic">🗓️</span>Jadwal</a>
    <a class="bnv" data-sec="sec-rkbm" href="#sec-rkbm"><span class="ic">📚</span>Riwayat</a>
    <a class="bnv" data-sec="sec-agenda" href="#sec-agenda"><span class="ic">📅</span>Agenda</a>
  </nav>

  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/guard.js"></script>
  <script src="../js/nav.js"></script>
  <script>
  (function () {
    'use strict';

    // Daftar kelas — PLACEHOLDER. Ganti value dengan kelasId asli dari sheet.
    var KELAS = [
      { id: '7',  label: 'Kelas 7' },
      { id: '8',  label: 'Kelas 8' },
      { id: '9',  label: 'Kelas 9' },
      { id: '10', label: 'Kelas 10' },
      { id: '11', label: 'Kelas 11' },
      { id: '12', label: 'Kelas 12' }
    ];
    var SESI = [1, 2, 3, 4, 5, 6, 7, 8];

    var user = currentUser();
    document.getElementById('nama-guru').textContent = user.nama || 'Guru';
    document.getElementById('btn-logout').addEventListener('click', logout);

    function fillSelect(el, items, getVal, getLabel) {
      el.innerHTML = '';
      items.forEach(function (it) {
        var opt = document.createElement('option');
        opt.value = getVal(it);
        opt.textContent = getLabel(it);
        el.appendChild(opt);
      });
    }

    fillSelect(document.getElementById('kbm-kelas'), KELAS,
      function (k) { return k.id; }, function (k) { return k.label; });
    fillSelect(document.getElementById('nilai-kelas'), KELAS,
      function (k) { return k.id; }, function (k) { return k.label; });
    fillSelect(document.getElementById('kbm-sesi'), SESI,
      function (s) { return s; }, function (s) { return 'Sesi ' + s; });

    function setStatus(el, kind, msg) {
      el.className = 'status-msg ' + kind;
      el.textContent = msg;
      el.hidden = false;
    }

    function today() {
      return new Date().toISOString().slice(0, 10);
    }

    // ---------- Simpan KBM ----------
    var formKbm = document.getElementById('form-kbm');
    var kbmBtn = document.getElementById('kbm-submit');
    var kbmStatus = document.getElementById('kbm-status');

    formKbm.addEventListener('submit', async function (e) {
      e.preventDefault();
      kbmBtn.disabled = true;
      setStatus(kbmStatus, 'info', 'Menyimpan...');

      var payload = {
        guru: user.nama,
        kelas: document.getElementById('kbm-kelas').value,
        mapel: document.getElementById('kbm-mapel').value.trim(),
        sesi: document.getElementById('kbm-sesi').value,
        tanggal: today(),
        materi: document.getElementById('kbm-materi').value.trim(),
        catatan: document.getElementById('kbm-catatan').value.trim(),
        kehadiran: { status: 'hadir' },
        absensi: []
      };

      try {
        var r = await apiCall('simpanKBM', payload);
        if (r && r.success) {
          setStatus(kbmStatus, 'ok', 'KBM tersimpan.');
          formKbm.reset();
        } else {
          setStatus(kbmStatus, 'err', (r && r.message) || 'Gagal menyimpan KBM.');
        }
      } catch (err) {
        setStatus(kbmStatus, 'err', 'Tidak dapat terhubung ke server.');
        console.error(err);
      } finally {
        kbmBtn.disabled = false;
      }
    });

    // ---------- Input Nilai ----------
    var nilaiStatus = document.getElementById('nilai-status');
    var santriList = document.getElementById('santri-list');
    var btnMuat = document.getElementById('btn-muat-santri');
    var btnSimpan = document.getElementById('btn-simpan-nilai');

    function normalizeSantri(data) {
      var arr = Array.isArray(data) ? data
              : (data && (data.santri || data.data || data.list)) || [];
      return arr.map(function (s) {
        return {
          strId: s.strId || s.id || s.STR_ID || s.strID || '',
          nama: s.nama || s.name || s.namaSantri || s.NAMA || '(tanpa nama)'
        };
      });
    }

    btnMuat.addEventListener('click', async function () {
      var kelasId = document.getElementById('nilai-kelas').value;
      btnMuat.disabled = true;
      santriList.innerHTML = '';
      btnSimpan.hidden = true;
      setStatus(nilaiStatus, 'info', 'Memuat santri...');

      try {
        var r = await apiCall('getSantriPerKelas', { kelasId: kelasId });
        console.log('getSantriPerKelas ->', r);
        if (!r || !r.success) {
          setStatus(nilaiStatus, 'err', (r && r.message) || 'Gagal memuat santri.');
          return;
        }
        var santri = normalizeSantri(r.data);
        if (!santri.length) {
          setStatus(nilaiStatus, 'info', 'Tidak ada santri pada kelas ini.');
          return;
        }
        santri.forEach(function (s) {
          var row = document.createElement('div');
          row.className = 'santri-row';
          row.dataset.strId = s.strId;
          row.dataset.nama = s.nama;

          var nama = document.createElement('span');
          nama.className = 'nama';
          nama.textContent = s.nama;

          var inp = document.createElement('input');
          inp.type = 'number';
          inp.min = '0';
          inp.max = '100';
          inp.step = '1';
          inp.setAttribute('aria-label', 'Nilai ' + s.nama);

          row.appendChild(nama);
          row.appendChild(inp);
          santriList.appendChild(row);
        });
        nilaiStatus.hidden = true;
        btnSimpan.hidden = false;
      } catch (err) {
        setStatus(nilaiStatus, 'err', 'Tidak dapat terhubung ke server.');
        console.error(err);
      } finally {
        btnMuat.disabled = false;
      }
    });

    btnSimpan.addEventListener('click', async function () {
      var rows = santriList.querySelectorAll('.santri-row');
      var nilai = [];
      rows.forEach(function (row) {
        var val = row.querySelector('input').value;
        if (val !== '') {
          nilai.push({
            strId: row.dataset.strId,
            nama: row.dataset.nama,
            nilai: Number(val)
          });
        }
      });

      if (!nilai.length) {
        setStatus(nilaiStatus, 'err', 'Belum ada nilai yang diisi.');
        return;
      }

      var payload = {
        kelasId: document.getElementById('nilai-kelas').value,
        mapelId: document.getElementById('nilai-mapel').value.trim(),
        semester: document.getElementById('nilai-semester').value,
        jenis: document.getElementById('nilai-jenis').value.trim(),
        nomorUlangan: Number(document.getElementById('nilai-nomor').value || 1),
        keterangan: document.getElementById('nilai-ket').value.trim(),
        nilai: nilai
      };

      btnSimpan.disabled = true;
      setStatus(nilaiStatus, 'info', 'Menyimpan ' + nilai.length + ' nilai...');

      try {
        var r = await apiCall('simpanNilai', payload);
        if (r && r.success) {
          setStatus(nilaiStatus, 'ok', 'Nilai tersimpan (' + nilai.length + ' santri).');
        } else {
          setStatus(nilaiStatus, 'err', (r && r.message) || 'Gagal menyimpan nilai.');
        }
      } catch (err) {
        setStatus(nilaiStatus, 'err', 'Tidak dapat terhubung ke server.');
        console.error(err);
      } finally {
        btnSimpan.disabled = false;
      }
    });

    // ---------- Section read-only: Jadwal / Riwayat KBM / Riwayat Absensi ----------

    // tanggal riwayat sudah string "dd/MM/yyyy" -> jadikan key "yyyyMMdd" untuk sorting.
    function dmyKey(s) {
      var m = String(s || '').match(/^(\d{2})\/(\d{2})\/(\d{4})/);
      return m ? (m[3] + m[2] + m[1]) : String(s || '');
    }

    function loadSection(opts) {
      var statusEl = opts.status;
      statusEl.className = 'status-msg info';
      statusEl.textContent = 'Memuat...';
      statusEl.hidden = false;
      opts.table.innerHTML = '';

      apiCall(opts.action, opts.params || {}).then(function (r) {
        console.log(opts.action, '->', r);
        if (!r || !r.success) {
          statusEl.className = 'status-msg err';
          statusEl.textContent = (r && r.message) || 'Gagal memuat data.';
          return;
        }
        var rows = opts.getRows(r);
        if (opts.sortDescBy) {
          rows = rows.slice().sort(function (a, b) {
            var ka = opts.sortDescBy(a), kb = opts.sortDescBy(b);
            return ka < kb ? 1 : ka > kb ? -1 : 0;
          });
        }
        statusEl.hidden = true;
        buildTable(opts.table, opts.columns, rows, opts.empty);
      }).catch(function (err) {
        statusEl.className = 'status-msg err';
        statusEl.textContent = 'Tidak dapat terhubung ke server.';
        console.error(err);
      });
    }

    var loadedSections = {};
    function loadOnce(id, opts) {
      if (loadedSections[id]) return;
      loadedSections[id] = true;
      loadSection(opts);
    }

    var jadwalOpts = {
      action: 'getJadwalGuru',
      status: document.getElementById('jadwal-status'),
      table: document.getElementById('jadwal-table'),
      empty: 'Belum ada jadwal.',
      // response ter-nested: array ada di data.data
      getRows: function (r) { return (r.data && Array.isArray(r.data.data)) ? r.data.data : []; },
      columns: [
        { label: 'Hari', get: function (x) { return x.hari; } },
        { label: 'Sesi', get: function (x) { return x.sesi; } },
        { label: 'Mapel', get: function (x) { return x.mapel; } },
        { label: 'Kelas', get: function (x) { return x.kelas; } }
      ]
    };
    var rkbmOpts = {
      action: 'getRiwayatKBMGuru',
      status: document.getElementById('rkbm-status'),
      table: document.getElementById('rkbm-table'),
      empty: 'Belum ada riwayat KBM.',
      getRows: function (r) { return Array.isArray(r.data) ? r.data : []; },
      sortDescBy: function (x) { return dmyKey(x.tanggal); },
      columns: [
        { label: 'Tanggal', get: function (x) { return x.tanggal; } },
        { label: 'Kelas', get: function (x) { return x.kelas; } },
        { label: 'Mapel', get: function (x) { return x.mapel; } },
        { label: 'Materi', get: function (x) { return x.materi; } },
        { label: 'Status', get: function (x) { return x.status; } }
      ]
    };
    var rabsOpts = {
      action: 'getRiwayatAbsensiGuru',
      status: document.getElementById('rabs-status'),
      table: document.getElementById('rabs-table'),
      empty: 'Belum ada riwayat absensi.',
      getRows: function (r) { return Array.isArray(r.data) ? r.data : []; },
      sortDescBy: function (x) { return dmyKey(x.tanggal); },
      columns: [
        { label: 'Tanggal', get: function (x) { return x.tanggal; } },
        { label: 'Status', get: function (x) { return x.status; } },
        { label: 'Alasan', get: function (x) { return x.alasan; } }
      ]
    };

    // Muat saat section pertama kali dibuka (hemat request di HP).
    document.getElementById('sec-jadwal').addEventListener('toggle', function () {
      if (this.open) loadOnce('jadwal', jadwalOpts);
    });
    document.getElementById('sec-rkbm').addEventListener('toggle', function () {
      if (this.open) loadOnce('rkbm', rkbmOpts);
    });
    document.getElementById('sec-rabs').addEventListener('toggle', function () {
      if (this.open) loadOnce('rabs', rabsOpts);
    });

    // ---------- Kalender / Agenda ----------
    (function loadAgenda() {
      var st = document.getElementById('agenda-status');
      var box = document.getElementById('agenda-list');
      st.className = 'status-msg info';
      st.textContent = 'Memuat...';
      st.hidden = false;

      apiCall('getAgenda', {}).then(function (r) {
        console.log('getAgenda ->', r);
        if (!r || !r.success) {
          st.className = 'status-msg err';
          st.textContent = (r && r.message) || 'Gagal memuat agenda.';
          return;
        }
        st.hidden = true;
        renderAgenda(box, Array.isArray(r.data) ? r.data : []);
      }).catch(function (err) {
        st.className = 'status-msg err';
        st.textContent = 'Tidak dapat terhubung ke server.';
        console.error(err);
      });
    })();
  })();
  </script>
</body>
</html>
