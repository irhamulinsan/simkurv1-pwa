<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f18518">
  <meta name="description" content="SIMKUR MA'HAD - Sistem Informasi Kurikulum & Akademik Ma'had Al-Ikhlash">
  <title>Masuk &middot; SIMKUR MA'HAD</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="auth">
    <section class="auth-card" aria-labelledby="auth-title">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">
          <!-- Placeholder logo, ganti dengan logo asli Ma'had Al-Ikhlash -->
          <span>MA</span>
        </div>
        <h1 id="auth-title" class="brand-name">SIMKUR MA'HAD</h1>
        <p class="brand-sub">Ma'had Al-Ikhlash</p>
      </div>

      <p
        id="login-error"
        class="alert alert-error"
        role="alert"
        aria-live="assertive"
        hidden
      ></p>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            autocomplete="username"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
            required
          >
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-group">
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              required
            >
            <button
              type="button"
              id="toggle-password"
              class="input-addon"
              aria-label="Tampilkan password"
              aria-pressed="false"
            >Lihat</button>
          </div>
        </div>

        <button type="submit" id="login-submit" class="btn btn-primary">
          Masuk
        </button>
      </form>

      <p class="auth-foot">&copy; SIMKUR MA'HAD</p>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (err) {
          console.warn('Registrasi service worker gagal:', err);
        });
      });
    }
  </script>
</body>
</html>
